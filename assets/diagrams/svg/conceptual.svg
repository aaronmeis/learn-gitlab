<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Conceptual view: control plane versus job plane">
  <rect width="960" height="540" fill="#0f1419"/>
  <text x="32" y="36" fill="#ffd400" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">Conceptual · OV-1</text>
  <text x="32" y="58" fill="#9aa4b2" font-family="Inter,Segoe UI,sans-serif" font-size="12">Capabilities and trust domains for Dedicated for Government</text>

  <!-- Control plane -->
  <rect x="40" y="90" width="420" height="380" rx="16" fill="#16202a" stroke="#3d4f61" stroke-width="2"/>
  <rect x="40" y="90" width="420" height="44" rx="16" fill="#1e2f3f"/>
  <rect x="40" y="118" width="420" height="16" fill="#1e2f3f"/>
  <text x="60" y="118" fill="#7dd3fc" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">Tenant Control Plane (GovCloud)</text>
  <text x="300" y="118" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="11">GitLab managed</text>

  <!-- capability tiles -->
  <g font-family="Inter,Segoe UI,sans-serif">
    <rect x="64" y="156" width="170" height="70" rx="10" fill="#0b1220" stroke="#38bdf8"/>
    <circle cx="88" cy="182" r="12" fill="#0ea5e9"/><path d="M82 182h12M88 176v12" stroke="#041018" stroke-width="2"/>
    <text x="110" y="178" fill="#e2e8f0" font-size="12" font-weight="600">C1 Change Record</text>
    <text x="110" y="196" fill="#94a3b8" font-size="10">MR · approvals · audit</text>

    <rect x="250" y="156" width="180" height="70" rx="10" fill="#0b1220" stroke="#38bdf8"/>
    <circle cx="274" cy="182" r="12" fill="#0ea5e9"/><rect x="268" y="176" width="12" height="12" rx="2" fill="#041018"/>
    <text x="296" y="178" fill="#e2e8f0" font-size="12" font-weight="600">C2 Source of Truth</text>
    <text x="296" y="196" fill="#94a3b8" font-size="10">Git history · Gitaly</text>

    <rect x="64" y="244" width="170" height="70" rx="10" fill="#0b1220" stroke="#38bdf8"/>
    <circle cx="88" cy="270" r="12" fill="#0ea5e9"/><path d="M82 270h12" stroke="#041018" stroke-width="2"/>
    <text x="110" y="266" fill="#e2e8f0" font-size="12" font-weight="600">C3 Pipeline Contract</text>
    <text x="110" y="284" fill="#94a3b8" font-size="10">CI definition · gates</text>

    <rect x="250" y="244" width="180" height="70" rx="10" fill="#0b1220" stroke="#38bdf8"/>
    <circle cx="274" cy="270" r="12" fill="#0ea5e9"/><circle cx="274" cy="270" r="5" fill="#041018"/>
    <text x="296" y="266" fill="#e2e8f0" font-size="12" font-weight="600">C4 Findings Ledger</text>
    <text x="296" y="284" fill="#94a3b8" font-size="10">SAST · DAST · secrets</text>

    <rect x="64" y="332" width="366" height="70" rx="10" fill="#0b1220" stroke="#fbbf24"/>
    <circle cx="88" cy="358" r="12" fill="#f59e0b"/><path d="M82 358h12M88 352v12" stroke="#1c1405" stroke-width="2"/>
    <text x="110" y="354" fill="#e2e8f0" font-size="12" font-weight="600">C5 Identity &amp; Policy</text>
    <text x="110" y="372" fill="#94a3b8" font-size="10">Agency IdP · SAML/OIDC · AO evidence</text>
  </g>

  <!-- Job plane -->
  <rect x="500" y="90" width="420" height="240" rx="16" fill="#14201a" stroke="#3f5f4a" stroke-width="2"/>
  <rect x="500" y="90" width="420" height="44" rx="16" fill="#1a3024"/>
  <rect x="500" y="118" width="420" height="16" fill="#1a3024"/>
  <text x="520" y="118" fill="#6ee7b7" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">Customer Job Plane (Agency VPC)</text>
  <text x="780" y="118" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="11">Customer managed</text>

  <g font-family="Inter,Segoe UI,sans-serif">
    <rect x="524" y="156" width="170" height="70" rx="10" fill="#0b1612" stroke="#34d399"/>
    <rect x="536" y="170" width="24" height="24" rx="4" fill="#10b981"/>
    <text x="570" y="178" fill="#e2e8f0" font-size="12" font-weight="600">FIPS Runners</text>
    <text x="570" y="196" fill="#94a3b8" font-size="10">Untrusted execution</text>

    <rect x="714" y="156" width="180" height="70" rx="10" fill="#0b1612" stroke="#34d399"/>
    <rect x="726" y="170" width="24" height="24" rx="4" fill="#10b981"/>
    <text x="760" y="178" fill="#e2e8f0" font-size="12" font-weight="600">Self-hosted AI GW</text>
    <text x="760" y="196" fill="#94a3b8" font-size="10">Zero-egress Duo path</text>

    <rect x="524" y="244" width="370" height="60" rx="10" fill="#0b1612" stroke="#34d399"/>
    <text x="544" y="270" fill="#e2e8f0" font-size="12" font-weight="600">Agency IdP · PrivateLink · Workload accounts</text>
    <text x="544" y="288" fill="#94a3b8" font-size="10">Identity and network stay in the customer estate</text>
  </g>

  <!-- External -->
  <rect x="500" y="360" width="420" height="110" rx="16" fill="#241418" stroke="#7f1d1d" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="520" y="392" fill="#fda4af" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">External / unauthorized egress</text>
  <text x="520" y="416" fill="#fecdd3" font-family="Inter,Segoe UI,sans-serif" font-size="12">GitLab.com AI Gateway · commercial model endpoints · public runner pools</text>
  <text x="520" y="440" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="11">Not in the FedRAMP Moderate Dedicated for Government placement</text>
</svg>
