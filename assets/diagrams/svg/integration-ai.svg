  <!-- IDE -->
  <rect x="40" y="200" width="150" height="90" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="115" y="240" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">IDE / Web UI</text>
  <text x="115" y="262" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="11">Duo request</text>

  <path d="M198 245 H250" stroke="#64748b" stroke-width="2"/>

  <!-- fork -->
  <circle cx="270" cy="245" r="10" fill="#ffd400"/>

  <!-- good path -->
  <path d="M280 245 H330" stroke="#34d399" stroke-width="3"/>
  <path d="M330 245 V160 H380" stroke="#34d399" stroke-width="3"/>
  <rect x="380" y="110" width="240" height="100" rx="14" fill="#14201a" stroke="#34d399" stroke-width="2"/>
  <text x="500" y="145" text-anchor="middle" fill="#6ee7b7" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">Self-hosted AI Gateway</text>
  <text x="500" y="168" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="12">Inside customer boundary</text>
  <text x="500" y="190" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="11">Authorized on Dedicated for Government</text>

  <path d="M620 160 H680" stroke="#34d399" stroke-width="3"/>
  <rect x="680" y="110" width="240" height="100" rx="14" fill="#14201a" stroke="#34d399" stroke-width="2"/>
  <text x="800" y="145" text-anchor="middle" fill="#6ee7b7" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">Customer models</text>
  <text x="800" y="168" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="12">Bedrock-gov · private LLM</text>
  <text x="800" y="190" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="11">Prompts stay in estate</text>

  <!-- bad path -->
  <path d="M330 245 V340 H380" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6 4"/>
  <rect x="380" y="290" width="240" height="100" rx="14" fill="#241418" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="500" y="325" text-anchor="middle" fill="#fda4af" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">GitLab-managed AI Gateway</text>
  <text x="500" y="348" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="12">Commercial model vendors</text>
  <text x="500" y="370" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="11">Not authorized on Gov Dedicated</text>

  <path d="M620 340 H680" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6 4"/>
  <rect x="680" y="290" width="240" height="100" rx="14" fill="#241418" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="800" y="325" text-anchor="middle" fill="#fda4af" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">External LLM APIs</text>
  <text x="800" y="348" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="12">Prompt / code leave boundary</text>
  <text x="800" y="370" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="11">Agent Platform also blocked</text>

  <rect x="40" y="440" width="880" height="60" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="60" y="475" fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="13">Also on this view: SAML/OIDC IdP, PrivateLink to tenant, Continuous Monitoring export for FR2411959145.</text>
