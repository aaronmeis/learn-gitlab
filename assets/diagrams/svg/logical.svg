<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Logical view: request path and Git RPC">
  <rect width="960" height="540" fill="#0f1419"/>
  <text x="32" y="36" fill="#ffd400" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">Logical · SV-1</text>
  <text x="32" y="58" fill="#9aa4b2" font-family="Inter,Segoe UI,sans-serif" font-size="12">Front door → application → queue → system of record → Git RPC → job worker</text>

  <!-- flow boxes -->
  <g font-family="Inter,Segoe UI,sans-serif" font-size="12">
    <rect x="40" y="120" width="140" height="88" rx="12" fill="#16202a" stroke="#38bdf8" stroke-width="2"/>
    <text x="110" y="152" text-anchor="middle" fill="#7dd3fc" font-weight="700">Front Door</text>
    <text x="110" y="172" text-anchor="middle" fill="#e2e8f0">NGINX / Workhorse</text>
    <text x="110" y="190" text-anchor="middle" fill="#94a3b8">TLS · Git HTTP</text>

    <path d="M186 164 H214" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="220" y="120" width="140" height="88" rx="12" fill="#16202a" stroke="#38bdf8" stroke-width="2"/>
    <text x="290" y="152" text-anchor="middle" fill="#7dd3fc" font-weight="700">Application</text>
    <text x="290" y="172" text-anchor="middle" fill="#e2e8f0">Rails / Puma</text>
    <text x="290" y="190" text-anchor="middle" fill="#94a3b8">60s timeout</text>

    <path d="M366 164 H394" stroke="#64748b" stroke-width="2"/>

    <rect x="400" y="120" width="140" height="88" rx="12" fill="#16202a" stroke="#a78bfa" stroke-width="2"/>
    <text x="470" y="152" text-anchor="middle" fill="#c4b5fd" font-weight="700">Job Queue</text>
    <text x="470" y="172" text-anchor="middle" fill="#e2e8f0">Redis · Sidekiq</text>
    <text x="470" y="190" text-anchor="middle" fill="#94a3b8">async offload</text>

    <path d="M546 164 H574" stroke="#64748b" stroke-width="2"/>

    <rect x="580" y="120" width="140" height="88" rx="12" fill="#16202a" stroke="#38bdf8" stroke-width="2"/>
    <text x="650" y="152" text-anchor="middle" fill="#7dd3fc" font-weight="700">System Record</text>
    <text x="650" y="172" text-anchor="middle" fill="#e2e8f0">PostgreSQL</text>
    <text x="650" y="190" text-anchor="middle" fill="#94a3b8">SoR for changes</text>

    <path d="M726 164 H754" stroke="#64748b" stroke-width="2"/>

    <rect x="760" y="120" width="160" height="88" rx="12" fill="#16202a" stroke="#38bdf8" stroke-width="2"/>
    <text x="840" y="152" text-anchor="middle" fill="#7dd3fc" font-weight="700">Git RPC</text>
    <text x="840" y="172" text-anchor="middle" fill="#e2e8f0">Gitaly (gRPC)</text>
    <text x="840" y="190" text-anchor="middle" fill="#94a3b8">no shared NFS</text>
  </g>

  <!-- boundary -->
  <line x1="40" y1="280" x2="920" y2="280" stroke="#334155" stroke-dasharray="8 6"/>
  <text x="40" y="272" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="11">Trust boundary — job plane below</text>

  <rect x="300" y="310" width="360" height="140" rx="14" fill="#14201a" stroke="#34d399" stroke-width="2"/>
  <text x="480" y="348" text-anchor="middle" fill="#6ee7b7" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">Job Worker (outside tenant on Gov)</text>
  <text x="480" y="376" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="12">GitLab Runner · FIPS image · outbound HTTPS + runner token</text>
  <text x="480" y="400" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="12">Clones · builds · scans · pushes artifacts — never inbound into the tenant</text>
  <text x="480" y="424" text-anchor="middle" fill="#fbbf24" font-family="Inter,Segoe UI,sans-serif" font-size="11">Token theft owns a worker, not Postgres</text>

  <path d="M470 208 V310" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
